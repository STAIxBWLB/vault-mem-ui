name: Release

# Authoring this workflow does not create a tag or enable publication. It mirrors vault-mem's release flow: a version
# tag on main runs the checks again, packs once, publishes that exact tarball with provenance, then publishes the
# GitHub release from the changelog section. `vars.NPM_PUBLISH_ENABLED` keeps publication off until a person sets it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Require matching version, tag, commit and dated changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bun scripts/release-check.ts
      - name: Require tag commit on main with green main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag commit $GITHUB_SHA is not on main. Delete the tag, merge the release preparation to main, then retag with bun run release:tag --push." >&2
            exit 1
          fi
          bun scripts/release-ci.ts
      - run: bun install --frozen-lockfile
      # Build, typecheck and test. The build is what puts dist/panel.js and dist/panel.css in the tarball below.
      - run: bun run check
      - name: Verify npm package dry-run
        run: npm pack --dry-run --ignore-scripts
      - name: Stage the npm tarball for validation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, renameSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const dir = join(process.env.RUNNER_TEMP, 'release-package');
          mkdirSync(dir);
          const parsed = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--pack-destination', dir], { encoding: 'utf8' }));
          // npm prints one array entry per package up to v11 and an object keyed by package name from v12 on.
          const packed = Array.isArray(parsed) ? parsed : Object.values(parsed);
          if (packed.length !== 1) throw new Error('Expected exactly one package');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (packed[0].name !== pkg.name || packed[0].version !== pkg.version) throw new Error('Packed package identity differs');
          // The plugin and the standalone host both read this package's own dist, so a tarball without it is unusable.
          const files = new Set(packed[0].files.map(file => file.path));
          for (const required of ['dist/panel.js', 'dist/panel.css', 'bin/vmem-ui.ts', 'src/plugin/index.ts']) {
            if (!files.has(required)) throw new Error(`Tarball is missing ${required}; run bun run build before packing`);
          }
          const filename = packed[0].filename;
          if (typeof filename !== 'string' || !/^[A-Za-z0-9._-]+\.tgz$/.test(filename)) throw new Error('Unexpected archive filename');
          renameSync(join(dir, filename), join(dir, 'package.tgz'));
          const sha256 = createHash('sha256').update(readFileSync(join(dir, 'package.tgz'))).digest('hex');
          writeFileSync(join(dir, 'manifest.json'), JSON.stringify({ name: pkg.name, version: pkg.version, tag: process.env.RELEASE_TAG, commit: process.env.RELEASE_SHA, sha256, distTag: pkg.version.includes('-') ? 'next' : 'latest' }) + '\n');
          NODE
      # A green checkout does not prove the bytes npm receives do: a value import from a devDependency passes build,
      # typecheck and staging, and only installing the tarball in a consumer shows it. Runs before the artifact upload.
      - name: Install the staged tarball in a clean consumer
        env:
          RELEASE_TARBALL: ${{ runner.temp }}/release-package/package.tgz
        run: bun scripts/package-smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved artifact with npm OIDC
    needs: validate
    # This variable is intentionally not configured by this change. Without it this job is skipped.
    if: github.repository == 'STAIxBWLB/vault-mem-ui' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/publish-package
      - name: Verify toolchain and artifact binding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const npm = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (Number(process.versions.node.split('.')[0]) < 24 || npm[0] < 11 || (npm[0] === 11 && (npm[1] < 5 || (npm[1] === 5 && npm[2] < 1)))) throw new Error('OIDC requires Node 24 and npm >=11.5.1 in this workflow');
          const dir = join(process.env.RUNNER_TEMP, 'publish-package');
          const manifest = JSON.parse(readFileSync(join(dir, 'manifest.json'), 'utf8'));
          const archive = join(dir, 'package.tgz');
          const sha256 = createHash('sha256').update(readFileSync(archive)).digest('hex');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8' }));
          if (manifest.commit !== process.env.RELEASE_SHA || manifest.tag !== process.env.RELEASE_TAG || manifest.tag !== `v${pkg.version}` || manifest.sha256 !== sha256 || manifest.name !== pkg.name || manifest.version !== pkg.version || packed.name !== pkg.name || packed.version !== pkg.version) throw new Error('Artifact differs from the validated tag');
          const distTag = pkg.version.includes('-') ? 'next' : 'latest';
          if (manifest.distTag !== distTag) throw new Error('Unexpected npm dist-tag');
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`);
          NODE
      - name: Publish the exact validated artifact
        run: npm publish "$RUNNER_TEMP/publish-package/package.tgz" --registry https://registry.npmjs.org --provenance --access public --tag "$NPM_DIST_TAG" --ignore-scripts

  github-release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
      - name: Write release notes and name the validated assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, renameSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'release-assets');
          const manifest = JSON.parse(readFileSync(join(dir, 'manifest.json'), 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (manifest.tag !== process.env.RELEASE_TAG || manifest.commit !== process.env.RELEASE_SHA || manifest.version !== pkg.version) throw new Error('Artifact differs from the released tag');
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line.startsWith(`## [${pkg.version}] - `));
          if (start < 0) throw new Error('CHANGELOG has no section for this version');
          let end = lines.findIndex((line, i) => i > start && line.startsWith('## ['));
          if (end < 0) end = lines.length;
          const previous = end < lines.length ? /^## \[([^\]]+)\]/.exec(lines[end])?.[1] : undefined;
          const base = `${pkg.name.replace(/^@/, '').replace('/', '-')}-${pkg.version}`;
          renameSync(join(dir, 'package.tgz'), join(dir, `${base}.tgz`));
          renameSync(join(dir, 'manifest.json'), join(dir, `${base}.manifest.json`));
          const notes = [
            lines.slice(start + 1, end).join('\n').trim(), '',
            '## Install', '', '```', `npm i -g ${pkg.name}@${pkg.version}`, '```', '',
            '`vmem-ui` runs under Bun, so Bun 1.4.2 or newer must be on `PATH`; the command refuses to start without it. As a panel, load the plugin from the `acon` console instead: `@staix/vault-mem-ui/ui-plugin`.', '',
            `Published to npm with provenance through GitHub OIDC trusted publishing. The validated tarball (SHA-256 \`${manifest.sha256}\`) and its manifest (tag, commit, SHA-256) from this run are attached.`,
            ...(previous ? ['', `**Full changelog**: https://github.com/${process.env.GITHUB_REPOSITORY}/compare/v${previous}...${process.env.RELEASE_TAG}`] : []),
          ].join('\n');
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), notes + '\n');
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_ASSETS=${dir}/${base}\nRELEASE_PRERELEASE=${pkg.version.includes('-')}\n`);
          NODE
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSETS.tgz" "$RELEASE_ASSETS.manifest.json" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            flags=()
            if [ "$RELEASE_PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$RELEASE_ASSETS.tgz" "$RELEASE_ASSETS.manifest.json" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes" --verify-tag "${flags[@]}"
          fi
